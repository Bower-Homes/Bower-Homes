<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background: bower-primary-dark rounded square -->
  <rect width="32" height="32" rx="7" fill="#041E42"/>

  <!-- House: left roof slope -->
  <path d="M16 4 L4.5 13.5" stroke="#A4DBE8" stroke-width="2.2" stroke-linecap="round"/>
  <!-- House: right roof slope -->
  <path d="M16 4 L27.5 13.5" stroke="#A4DBE8" stroke-width="2.2" stroke-linecap="round"/>
  <!-- House: left wall -->
  <line x1="5.5" y1="14.2" x2="5.5" y2="20" stroke="#A4DBE8" stroke-width="2" stroke-linecap="round"/>
  <!-- House: right wall -->
  <line x1="26.5" y1="14.2" x2="26.5" y2="20" stroke="#A4DBE8" stroke-width="2" stroke-linecap="round"/>

  <!-- Window: 2×2 grid -->
  <rect x="13"   y="7"    width="2.5" height="2.5" rx="0.4" fill="#A4DBE8"/>
  <rect x="16.5" y="7"    width="2.5" height="2.5" rx="0.4" fill="#A4DBE8"/>
  <rect x="13"   y="10.5" width="2.5" height="2.5" rx="0.4" fill="#A4DBE8"/>
  <rect x="16.5" y="10.5" width="2.5" height="2.5" rx="0.4" fill="#A4DBE8"/>

  <!-- Bird: body -->
  <ellipse cx="14" cy="25" rx="6.5" ry="4.5" fill="#A4DBE8"/>
  <!-- Bird: head -->
  <circle cx="20" cy="21" r="3.8" fill="#A4DBE8"/>
  <!-- Bird: beak -->
  <path d="M23 19.8 L28 21.5 L23 23.2 Z" fill="#041E42"/>
  <!-- Bird: eye -->
  <circle cx="21.5" cy="20.2" r="0.9" fill="#041E42"/>
  <!-- Bird: tail feather -->
  <path d="M8.5 24 L5 27.5" stroke="#A4DBE8" stroke-width="2" stroke-linecap="round"/>

  <!-- Branch -->
  <path d="M6 28 L25 28" stroke="#A4DBE8" stroke-width="1.8" stroke-linecap="round"/>
</svg>
